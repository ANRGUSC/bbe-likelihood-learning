[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wireless-neural-likelihoods"
version = "0.1.0"
description = "Simulation-based action-conditioned neural likelihoods for wireless adaptation."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Wireless Neural Likelihoods contributors"}]
dependencies = [
    "numpy",
    "scipy",
    "torch",
    "matplotlib",
    "pandas",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
